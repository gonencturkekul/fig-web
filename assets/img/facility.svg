<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-label="Packing and quality control facility">
  <rect width="640" height="460" fill="#f3e7d7"/>
  <rect y="330" width="640" height="130" fill="#e2d0b4"/>
  <rect x="60" y="90" width="520" height="240" rx="16" fill="#fdf8f1" stroke="#e6d8c6" stroke-width="4"/>

  <!-- conveyor -->
  <rect x="90" y="256" width="460" height="22" rx="11" fill="#c9b294"/>
  <g fill="#a8916f"><circle cx="130" cy="296" r="14"/><circle cx="230" cy="296" r="14"/><circle cx="330" cy="296" r="14"/><circle cx="430" cy="296" r="14"/><circle cx="510" cy="296" r="14"/></g>

  <!-- cartons -->
  <g>
    <g transform="translate(140 200)">
      <rect x="-38" y="0" width="76" height="56" rx="5" fill="#d8ab6c"/>
      <rect x="-38" y="0" width="76" height="14" rx="5" fill="#c2914f"/>
      <rect x="-14" y="20" width="28" height="22" rx="3" fill="#5b2c53" opacity=".8"/>
    </g>
    <g transform="translate(300 194)">
      <rect x="-42" y="0" width="84" height="62" rx="5" fill="#d8ab6c"/>
      <rect x="-42" y="0" width="84" height="15" rx="5" fill="#c2914f"/>
      <rect x="-15" y="22" width="30" height="24" rx="3" fill="#5b2c53" opacity=".8"/>
    </g>
    <g transform="translate(460 204)">
      <rect x="-34" y="0" width="68" height="52" rx="5" fill="#d8ab6c"/>
      <rect x="-34" y="0" width="68" height="13" rx="5" fill="#c2914f"/>
      <rect x="-12" y="19" width="24" height="20" rx="3" fill="#5b2c53" opacity=".8"/>
    </g>
  </g>

  <!-- QC badges -->
  <g transform="translate(180 140)">
    <circle cx="0" cy="0" r="30" fill="#4a6b3d"/>
    <path d="M-13 2l9 10 18-20" stroke="#fdf8f1" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(430 138)">
    <circle cx="0" cy="0" r="26" fill="#e08b3c"/>
    <path d="M-10 0l7 8 14-16" stroke="#fdf8f1" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="250" y="118" width="140" height="14" rx="7" fill="#e6d8c6"/>
  <rect x="270" y="142" width="100" height="10" rx="5" fill="#eee0cd"/>
