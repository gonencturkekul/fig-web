<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Whole and halved sun-dried figs">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e9d6"/><stop offset="1" stop-color="#e6d2b4"/>
    </linearGradient>
    <linearGradient id="fskin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a6d3f"/><stop offset="1" stop-color="#6d4726"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#fbg)"/>
  <circle cx="530" cy="90" r="120" fill="#f0dcbe" opacity=".8"/>

  <!-- halved fig showing seeded flesh -->
  <g transform="translate(230 250)">
    <ellipse cx="0" cy="0" rx="120" ry="112" fill="url(#fskin)"/>
    <ellipse cx="0" cy="6" rx="98" ry="92" fill="#c9a06a"/>
    <ellipse cx="0" cy="8" rx="76" ry="72" fill="#b8607f"/>
    <ellipse cx="0" cy="8" rx="52" ry="50" fill="#8d3f5f"/>
    <g fill="#f7e3c2" opacity=".92">
      <circle cx="-30" cy="-6" r="4"/><circle cx="-8" cy="-24" r="4"/><circle cx="18" cy="-8" r="4"/>
      <circle cx="30" cy="18" r="4"/><circle cx="2" cy="26" r="4"/><circle cx="-26" cy="26" r="4"/>
      <circle cx="-46" cy="8" r="3.4"/><circle cx="44" cy="-4" r="3.4"/><circle cx="12" cy="0" r="3.4"/>
      <circle cx="-14" cy="44" r="3"/><circle cx="24" cy="42" r="3"/>
    </g>
    <path d="M0-112c4-22 18-34 42-38-4 26-18 38-42 38z" fill="#4a6b3d"/>
  </g>

  <!-- whole dried figs -->
  <g transform="translate(462 300) rotate(-8)">
    <ellipse cx="0" cy="0" rx="92" ry="82" fill="url(#fskin)"/>
    <ellipse cx="-16" cy="-12" rx="46" ry="34" fill="#a97b48" opacity=".5"/>
    <path d="M0-82c3-18 14-28 34-31-3 21-14 31-34 31z" fill="#4a6b3d"/>
    <g stroke="#5c3a1e" stroke-width="2.5" opacity=".45" fill="none">
      <path d="M-58 6c22 16 60 20 96 4M-50 34c26 12 58 12 88-2"/>
    </g>
  </g>
  <g transform="translate(556 400) rotate(12) scale(.55)">
    <ellipse cx="0" cy="0" rx="92" ry="82" fill="url(#fskin)"/>
    <ellipse cx="-16" cy="-12" rx="46" ry="34" fill="#a97b48" opacity=".5"/>
    <path d="M0-82c3-18 14-28 34-31-3 21-14 31-34 31z" fill="#4a6b3d"/>
  </g>
</svg>
